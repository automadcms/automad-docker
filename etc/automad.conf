server {
	listen 80;

	root        /app;
	index       index.php;
	server_name automad-docker.local;

	client_max_body_size 100M;

	access_log off;

	location / {
		try_files $uri $uri/ /index.php$is_args$args;
	}

	location ~* "(?x)
		^/(config|lib)/
		| ^/automad/(console$|src/|lang/)
		| /(data|index)$
		| /\.history$
		| /shared/components$
		| /(packages|vendor)/.*\.(ts|less|md|sh|xml|json|lock)$
		| /vendor/.*(readme|license)
		| /(package|package-lock|composer)\.(json|lock)$
	" {
		if (-e $request_filename) {
			rewrite ^ /index.php?/_ last;
		}

		try_files $uri $uri/ /index.php$is_args$args;
	}

	location = /index.php {
		fastcgi_pass    127.0.0.1:9000;
		fastcgi_index   index.php;
		fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
		include         fastcgi_params;
	}

	location ~ \.php$ {
		return 404;
	}
}

